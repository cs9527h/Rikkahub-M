name: "功能建议（中文）"
description: "提出新功能或改进现有功能"
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先检查是否已有相同建议。是否采纳将结合实际需求、维护成本和项目架构评估。

        > 请勿提交 API Key、私人聊天、人格提示词或其他敏感信息。
  - type: textarea
    id: description
    attributes:
      label: "建议的功能"
      description: "具体希望增加或改善什么？"
      placeholder: "我希望……"
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: "使用场景"
      description: "说明在什么情况下使用、能解决什么问题。"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "已考虑的替代方案"
      description: "如有其他实现思路或临时解决方法，可在此说明。"
    validations:
      required: false
