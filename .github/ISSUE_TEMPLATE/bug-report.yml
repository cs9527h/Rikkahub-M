name: "错误反馈（中文）"
description: "报告 Rikkahub-M 的故障、异常或崩溃"
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供复现步骤和必要的环境信息。

        > 请勿在公开 Issue 中粘贴 API Key、聊天记录、个人信息、真实人格提示词或服务器密钥。
        > 请勿提交未经核实的 AI 生成问题报告。
  - type: textarea
    id: description
    attributes:
      label: "问题描述与复现步骤"
      description: "说明出现了什么问题，以及怎样重复触发。"
      placeholder: |
        1. 进入……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "预期行为"
      description: "你原本希望程序怎样运行？"
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: "截图或录屏"
      description: "如有截图或录屏，请先遮盖私人聊天、密钥与个人信息。"
    validations:
      required: false
  - type: input
    id: provider
    attributes:
      label: "模型服务商"
      description: "例如 OpenAI、Anthropic、Google、DeepSeek、自建服务。"
      placeholder: "DeepSeek"
    validations:
      required: false
  - type: input
    id: model
    attributes:
      label: "模型名称"
      description: "例如 deepseek-chat、gpt-4o、claude-sonnet 等。"
      placeholder: "deepseek-chat"
    validations:
      required: false
  - type: dropdown
    id: api-type
    attributes:
      label: "接口协议"
      description: "选择所使用的接口类型。"
      options:
        - "OpenAI Chat Completions"
        - "OpenAI Responses"
        - "Google Gemini"
        - "Anthropic"
        - "其他／不确定"
    validations:
      required: false
  - type: input
    id: app-version
    attributes:
      label: "应用版本"
      description: "例如 0.4.0，最好注明是否测试预览版。"
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: "Android 系统版本"
      description: "例如 Android 15。"
      placeholder: "Android 15"
    validations:
      required: true
  - type: input
    id: device-model
    attributes:
      label: "手机型号"
      description: "例如小米 14。"
      placeholder: "小米 14"
    validations:
      required: true
