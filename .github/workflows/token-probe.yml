name: Token probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Release with asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          head -c 200000 /dev/urandom > /tmp/asset.bin
          echo "--- with asset ---"
          gh release create v0.9.8 /tmp/asset.bin --target "$GITHUB_SHA" --title probe5 --notes probe5 2>&1 | tail -5
          gh release view v0.9.8 --json assets -q '.assets[].name' 2>&1 | tail -3
          gh release delete v0.9.8 --yes --cleanup-tag=false 2>&1 | tail -2
