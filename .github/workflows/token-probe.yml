name: Token probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Job-level write with workflow-level read
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api /repos/$GH_REPO -q '.permissions'
          gh release create v0.0.0-probe2 --target "$GITHUB_SHA" --title probe2 --notes probe2 2>&1 | tail -3
          gh release delete v0.0.0-probe2 --yes 2>&1 | tail -2
