name: Token probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release for existing tag with --target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "--- with --target ---"
          gh release create v0.9.8 --target "$GITHUB_SHA" --title probe3 --notes probe3 2>&1 | tail -3
          gh release delete v0.9.8 --yes 2>&1 | tail -1
          echo "--- without --target ---"
          gh release create v0.9.8 --title probe4 --notes probe4 2>&1 | tail -3
          gh release delete v0.9.8 --yes 2>&1 | tail -1
