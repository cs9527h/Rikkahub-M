name: Rikkahub-M release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release with the signed APK'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build signed Rikkahub-M APK
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare web-ui build tools
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --dir web-ui install --frozen-lockfile
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --channel=3 "platform-tools" "platforms;android-37.2" "build-tools;37.0.0" \
            || "$SDK_MANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Generate CI-only Firebase placeholder
        run: |
          python3 - <<'PY'
          import json
          config = {
            "project_info": {"project_number": "123456789012", "project_id": "mate-preview-ci-invalid",
                             "storage_bucket": "mate-preview-ci-invalid.appspot.com"},
            "client": [{"client_info": {"mobilesdk_app_id": "1:123456789012:android:0123456789abcdef012345",
                                        "android_client_info": {"package_name": "com.rikkahub.mate"}},
                        "api_key": [{"current_key": "CI_ONLY_INVALID_API_KEY_DO_NOT_USE"}]}],
            "configuration_version": "1"
          }
          with open("app/google-services.json", "w", encoding="utf-8") as f:
              json.dump(config, f)
          PY
      - name: Restore release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.MATE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo "::error::MATE_KEYSTORE_BASE64 secret is missing; refusing to publish an unsigned APK."; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/rikkahubm-release.jks"
          test -s "$RUNNER_TEMP/keys/rikkahubm-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/keys/rikkahubm-release.jks"
            echo "storePassword=${{ secrets.MATE_KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.MATE_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.MATE_KEY_PASSWORD }}"
          } >> local.properties
      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testGithubReleaseUnitTest --stacktrace --no-daemon
      - name: Build signed release APK
        run: ./gradlew :app:assembleGithubRelease --stacktrace --no-daemon
      - name: Verify signature, package and checksum
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/github/release -name '*.apk' | head -1)
          test -n "$APK"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee APK_SIGNING.txt
          # 包名必须真的是 com.rikkahub.mate，不能用脚本自说自话
          APKANALYZER=$(find "$SDK_ROOT" -name apkanalyzer | sort | tail -1)
          if [ -x "$APKANALYZER" ]; then
            PKG=$("$APKANALYZER" manifest application-id "$APK")
          elif command -v aapt >/dev/null; then
            PKG=$(aapt dump badging "$APK" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -1)
          else
            PKG=$(unzip -p "$APK" AndroidManifest.xml | strings | grep -o "com.rikkahub.mate" | head -1)
          fi
          echo "APK package: $PKG"
          test "$PKG" = "com.rikkahub.mate" || { echo "::error::Unexpected package id: $PKG"; exit 1; }
          sha256sum "$APK" | tee SHA256SUMS.txt
          cp "$APK" Rikkahub-M-0.1.0-preview.apk
          sha256sum Rikkahub-M-0.1.0-preview.apk > SHA256SUMS.txt
          ls -lh
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Rikkahub-M-signed-apk
          path: |
            Rikkahub-M-0.1.0-preview.apk
            SHA256SUMS.txt
            APK_SIGNING.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Rikkahub-M-signed-apk
      - name: Create or update preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.1.0-preview.1"
          NOTES=$(cat <<'EOF'
          Rikkahub-M 0.1.0-preview.1

          以 RikkaHub 原生架构为底座，整合 Mate 的 AstrBot 网关、设备配对与李鱼服务器入口。
          - 包名 com.rikkahub.mate，显示名 Rikkahub-M
          - 全新安装只有一个默认助手；原有 RikkaHub 聊天、模型与服务商功能保留
          - 已移除赞助、捐赠与推广入口；联系作者统一指向指定 QQ
          - APK 使用长期发布密钥签名（密钥仅存于 GitHub Actions Secrets）

          已知问题与未完成项见仓库 docs/MATE_V1_STATUS.md。
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Rikkahub-M-0.1.0-preview.apk SHA256SUMS.txt APK_SIGNING.txt --clobber
          else
            gh release create "$TAG" Rikkahub-M-0.1.0-preview.apk SHA256SUMS.txt APK_SIGNING.txt \
              --prerelease --title "Rikkahub-M 0.1.0-preview.1" --notes "$NOTES"
          fi
