name: Rikkahub-M release

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub Release with the signed APKs'
        type: boolean
        default: false
      prerelease:
        description: 'Publish as pre-release (default is stable after all automated checks pass)'
        type: boolean
        default: false
  push:
    branches:
      - master
    paths:
      - app/build.gradle.kts
      - .github/workflows/release.yml
    tags:
      - 'v*'

permissions:
  contents: read

env:
  VERSION: '1.1.4'
  EXPECTED_CERT_SHA256: 'e4b90a5f274074e2d8dbfa4d68226c0941635b6792716b89fd805a2318f2c94a'

jobs:
  build:
    name: Build signed Rikkahub-M APKs
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      signed_apk_ready: ${{ steps.signed_apk_upload.outcome == 'success' }}
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release guard contracts
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare web-ui build tools
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --dir web-ui install --frozen-lockfile
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --channel=3 "platform-tools" "platforms;android-37.2" "build-tools;37.0.0" \
            || "$SDK_MANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Generate CI-only Firebase placeholder
        run: |
          python3 - <<'PY'
          import json
          clients = []
          for pkg in ("com.rikkahub.mate", "com.rikkahub.mate.debug"):
              clients.append({
                  "client_info": {"mobilesdk_app_id": "1:123456789012:android:0123456789abcdef012345",
                                  "android_client_info": {"package_name": pkg}},
                  "api_key": [{"current_key": "CI_ONLY_INVALID_API_KEY_DO_NOT_USE"}],
              })
          config = {
              "project_info": {"project_number": "123456789012", "project_id": "mate-preview-ci-invalid",
                               "storage_bucket": "mate-preview-ci-invalid.appspot.com"},
              "client": clients,
              "configuration_version": "1",
          }
          with open("app/google-services.json", "w", encoding="utf-8") as f:
              json.dump(config, f)
          PY
      - name: Restore release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.MATE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MATE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MATE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo "::error::MATE_KEYSTORE_BASE64 secret is missing; refusing to publish an unsigned APK."; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/rikkahubm-release.jks"
          test -s "$RUNNER_TEMP/keys/rikkahubm-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/keys/rikkahubm-release.jks"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } >> local.properties
          chmod 600 local.properties "$RUNNER_TEMP/keys/rikkahubm-release.jks"
      - name: Web regression tests and type checks
        working-directory: web-ui
        run: |
          pnpm run test
          pnpm run typecheck
          pnpm exec oxlint app
      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest :app:testGithubDebugUnitTest --stacktrace --no-daemon
      - name: Upload unit and static verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Release-unit-static-results
          path: |
            app/build/test-results/**
            */build/test-results/**
            app/build/reports/lint-results*
          if-no-files-found: warn
      - name: Enable KVM for all instrumented tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: false
          script: bash scripts/run-connected-verification.sh
      - name: Upload instrumented verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Release-instrumented-results
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
            app/schemas/**
            evidence/long-chat-database-perf.log
          if-no-files-found: warn
      - name: Build signed release APKs
        run: ./gradlew :app:assembleGithubRelease --stacktrace --no-daemon
      - name: "Verify universal APK - ABI, package, signature, checksum"
        run: |
          set -euo pipefail
          APK_DIR=app/build/outputs/apk/github/release
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          APKANALYZER=$(find "$SDK_ROOT" -name apkanalyzer | sort | tail -1)
          test -x "$APKSIGNER"
          echo "== produced APKs =="
          ls -1 "$APK_DIR"/*.apk
          mkdir -p dist
          : > dist/APK_SIGNING.txt
          : > dist/SHA256SUMS.txt
          shopt -s nullglob
          apks=("$APK_DIR"/*.apk)
          [ "${#apks[@]}" -eq 1 ] || { echo "::error::Expected exactly one universal APK"; exit 1; }
          apk=${apks[0]}
          test -x "$APKANALYZER"
          test "$("$APKANALYZER" manifest version-name "$apk")" = "$VERSION"
          test "$("$APKANALYZER" manifest version-code "$apk")" -gt 60
          base=$(basename "$apk")
          abis=$(unzip -l "$apk" | awk '{print $4}' | grep -o 'lib/[^/]*/' | cut -d/ -f2 | sort -u | tr '\n' ' ')
          echo "--- $base abis: $abis"
          # 必须是真正包含两套原生库的通用包，不能只是改了文件名
          case "$abis" in *arm64-v8a*) ;; *) echo "::error::universal APK missing arm64-v8a"; exit 1;; esac
          case "$abis" in *x86_64*) ;; *) echo "::error::universal APK missing x86_64"; exit 1;; esac
          if [ -x "$APKANALYZER" ]; then
            pkg=$("$APKANALYZER" manifest application-id "$apk")
          elif command -v aapt >/dev/null; then
            pkg=$(aapt dump badging "$apk" | sed -n "s/package: name='\([^']*\)'.*/\1/p" | head -1)
          else
            pkg=$(unzip -p "$apk" AndroidManifest.xml | strings | grep -o 'com.rikkahub.mate' | head -1)
          fi
          [ "$pkg" = "com.rikkahub.mate" ] || { echo "::error::$base package=$pkg"; exit 1; }
          "$APKSIGNER" verify --print-certs "$apk" > /tmp/sig.txt
          cert=$(grep 'certificate SHA-256 digest' /tmp/sig.txt | head -1 | awk '{print $NF}' | tr -d ':' | tr 'A-F' 'a-f')
          [ "$cert" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::$base cert=$cert != expected"; exit 1; }
          out="dist/Rikkahub-M-${VERSION}.apk"
          cp "$apk" "$out"
          test -s app/build/outputs/mapping/githubRelease/mapping.txt
          cp app/build/outputs/mapping/githubRelease/mapping.txt "$RUNNER_TEMP/mapping-${VERSION}.txt"
          zip -j "dist/mapping-${VERSION}.zip" "$RUNNER_TEMP/mapping-${VERSION}.txt"
          (cd dist && sha256sum "$(basename "$out")" "mapping-${VERSION}.zip") > dist/SHA256SUMS.txt
          { echo "== $(basename "$out")"; echo "package: $pkg"; echo "abis: $abis"; cat /tmp/sig.txt; echo; } >> dist/APK_SIGNING.txt
          echo "== dist =="
          ls -lh dist
          cat dist/SHA256SUMS.txt
      - name: "Guard: built APK really is this version's source"
        run: |
          set -euo pipefail
          # 用户反馈过「装了新版本却还是复现老问题」：先证明构建产物来自当前源码，
          # 再谈修没修好。versionName/versionCode 与版本独有标记都必须能在 dex 里找到。
          APK=$(ls app/build/outputs/apk/github/release/*.apk)
          CODE=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | head -1 | grep -oE '[0-9]+')
          python3 scripts/verify_apk_artifact.py \
            --apk "$APK" \
            --version-name "$VERSION" \
            --version-code "$CODE" \
            --require-marker "记忆中心" \
            --require-marker "history_memory_task_log" \
            --require-marker "Workspace root deletion is prohibited" \
            --require-marker "EPUB total content too large"

      - name: Upload verified APKs
        id: signed_apk_upload
        uses: actions/upload-artifact@v4
        with:
          name: Rikkahub-M-signed-apk
          path: |
            dist/*.apk
            dist/mapping-*.zip
            dist/SHA256SUMS.txt
            dist/APK_SIGNING.txt
          if-no-files-found: error
          retention-days: 14

      - name: Android Lint (required; never ignored for publication)
        if: ${{ !cancelled() }}
        run: ./gradlew :app:lintGithubDebug --stacktrace --no-daemon
      - name: Upload full lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Release-lint-results
          path: app/build/reports/lint-results*
          if-no-files-found: warn

  upgrade:
    name: Verify signed upgrade from 0.2.4
    needs: build
    # A verified candidate can be tested even if lint is red; publish still requires build SUCCESS.
    if: always() && needs.build.outputs.signed_apk_ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Rikkahub-M-signed-apk
          path: dist
      - name: Obtain pinned baseline
        run: |
          curl --fail --location --retry 2 https://github.com/cs9527h/Rikkahub-M/releases/download/v0.2.4/Rikkahub-M-0.2.4.apk -o baseline.apk
          echo 'a634efbdc42dedb37ca5507a65a0cc88b18ab7b33c65ca979a3d63b99f84f13f  baseline.apk' | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash scripts/compare-installed-screens.sh signed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Signed-upgrade-screens
          path: evidence/
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build, upgrade]
    if: needs.build.result == 'success' && needs.upgrade.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.publish_release == true && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh CLI 在没有 .git 的目录里无法推断仓库，必须 checkout（或显式 --repo）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: Rikkahub-M-signed-apk
          path: dist
      - name: Render user-facing release notes
        run: |
          set -euo pipefail
          python3 scripts/user_release_notes.py "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          # 正文只允许四个用户分类，技术章节（发布策略/CI/构建记录）一律不得出现
          python3 - "$RUNNER_TEMP/release-notes.md" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          heads = set(re.findall(r"^### (.+)$", text, re.M))
          if not heads or heads - {"新增", "优化", "修复", "其他"}:
              raise SystemExit("Release 正文分类不合规: " + str(sorted(heads)))
          if re.search(r"^##\s*(发布策略|CI|构建|测试)", text, re.M):
              raise SystemExit("Release 正文混入了开发者技术章节")
          PY
          cp "$RUNNER_TEMP/release-notes.md" release-notes.md
      - name: Diagnose release permissions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh auth status || true
          gh api "/repos/$GH_REPO" -q '.permissions' || true
          gh api "/repos/$GH_REPO/actions/permissions/workflow" || true

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          # 性能台账门禁：每次发布必须为本版本记录性能基线状态（真机数据或明确待测）
          python3 - "$VERSION" <<'PY'
          import json,sys,pathlib
          version=sys.argv[1]
          data=json.loads(pathlib.Path('docs/perf/baseline.json').read_text())
          if data.get('version') != version:
              raise SystemExit('docs/perf/baseline.json 未记录 ' + version + ' 的性能状态，先更新再发布')
          print('perf baseline status:', data.get('measured'), data.get('source',''))
          PY
          (cd dist && sha256sum -c SHA256SUMS.txt)
          # 正式版只要求已完成的自动化检查，不再要求实体设备验收 JSON。
          # build + upgrade 两个 job 必须成功，签名、校验和、Lint 等步骤仍然不可跳过。
          flags=()
          if [[ "$VERSION" == *-* || "${PRERELEASE:-false}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          # 若对应 tag 已发布，绝不用新构建覆盖旧 APK：
          # 只有同名且 SHA-256 完全相同的资产才允许调整 Release 状态和中文说明。
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/existing-release"
            gh release download "$TAG" --repo "$GH_REPO" \
              --pattern "SHA256SUMS.txt" --pattern "Rikkahub-M-${VERSION}.apk" --pattern "mapping-${VERSION}.zip" \
              --dir "$RUNNER_TEMP/existing-release"
            (cd "$RUNNER_TEMP/existing-release" && sha256sum -c SHA256SUMS.txt)
            cmp dist/SHA256SUMS.txt "$RUNNER_TEMP/existing-release/SHA256SUMS.txt" || {
              echo "::error::Existing Release APK differs from this build. Refusing to replace or relabel."
              exit 1
            }
            if [[ "${#flags[@]}" -eq 0 ]]; then
              gh release edit "$TAG" --repo "$GH_REPO" --latest \
                --title "Rikkahub-M ${VERSION}" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease=false
            else
              gh release edit "$TAG" --repo "$GH_REPO" \
                --title "Rikkahub-M ${VERSION}" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease=true
            fi
          else
            # 偶发 403（Resource not accessible by integration）时重试，最多 3 次
            for attempt in 1 2 3; do
              if gh release create "$TAG" dist/*.apk dist/mapping-*.zip dist/SHA256SUMS.txt dist/APK_SIGNING.txt \
              --repo "$GH_REPO" --target "$GITHUB_SHA" "${flags[@]}" \
              --title "Rikkahub-M ${VERSION}" --notes-file "$RUNNER_TEMP/release-notes.md"; then
                break
              fi
              echo "::warning::release create 第 $attempt 次失败，5 秒后重试"
              sleep 5
            done
          fi
      - name: Publish to domestic update mirror (optional)
        # 备用更新源长期停在 0.8.3 的原因之一：这一步从来没接进流水线，全靠手动。
        # 配好 MIRROR_SSH_KEY 后每次正式发布都会同步 APK + 重建 manifest。
        env:
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
          MIRROR_HOST: ${{ secrets.MIRROR_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${MIRROR_SSH_KEY:-}" ]; then
            echo "未配置 MIRROR_SSH_KEY，跳过备用源更新（不影响 GitHub 发布）"
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$MIRROR_SSH_KEY" > ~/.ssh/id_mirror && chmod 600 ~/.ssh/id_mirror
          HOST="${MIRROR_HOST:-root@8.133.167.195}"
          {
            echo "Host ${HOST#*@}"
            echo "  IdentityFile ~/.ssh/id_mirror"
            echo "  StrictHostKeyChecking accept-new"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts_mirror"
            echo "  ConnectTimeout 20"
          } >> ~/.ssh/config
          bash scripts/publish_update_mirror.sh "$VERSION" "dist/Rikkahub-M-${VERSION}.apk" --deploy
          curl -fsSk "https://${HOST#*@}/updates/manifest.json" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); v=d['releases'][-1]['version']; print('mirror latest:', v); sys.exit(0 if v=='$VERSION' else 1)"
