name: Mate V1 preview build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/mate-v1-integration-20261119
    paths:
      - 'app/**'
      - 'ai/**'
      - 'gradle/**'
      - 'gradle.properties'
      - '*.gradle.kts'
      - '.github/workflows/mate-v1-preview.yml'
  pull_request:
    branches:
      - master

concurrency:
  group: mate-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Build Mate independent preview (source verification)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # ubuntu-latest has Android command-line tools already installed.
      # setup-android@v3 invokes removed "sdkmanager tools" and fails in CI.
      - name: Install SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDK_MANAGER" || { echo "Android SDK cmdline tools unavailable"; exit 1; }
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --channel=3 --list | grep -E 'platforms;android-37|build-tools;37' || true
          "$SDK_MANAGER" --channel=3 "platform-tools" "platforms;android-37.2" "build-tools;37.0.0" || "$SDK_MANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare web-ui build tools
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --dir web-ui install --frozen-lockfile
      - name: Generate CI-only Firebase placeholder
        # This is not a production Firebase project. Never upload real secrets.
        # Placeholder allows Kotlin/Compose build checks without borrowing upstream keys.
        run: |
          python3 - <<'PY'
          import json
          config = {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "mate-preview-ci-invalid",
              "storage_bucket": "mate-preview-ci-invalid.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef012345",
                "android_client_info": {
                  "package_name": "com.rikkahub.mate.debug"
                }
              },
              "api_key": [{"current_key": "CI_ONLY_INVALID_API_KEY_DO_NOT_USE"}]
            }],
            "configuration_version": "1"
          }
          with open("app/google-services.json", "w", encoding="utf-8") as f:
            json.dump(config, f)
          PY
      - name: Verify release and performance guard contracts
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Unit tests and Kotlin build
        run: |
          chmod +x ./gradlew
          ./gradlew :ai:testDebugUnitTest :app:testGithubDebugUnitTest :app:assembleGithubDebug --stacktrace --no-daemon
      - name: Upload test results for independently counted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Standalone-unit-test-results
          path: |
            app/build/test-results/**
            ai/build/test-results/**
            app/build/reports/lint-results*
          if-no-files-found: warn
      - name: Verify universal preview contents
        run: |
          python3 - <<'PY'
          import glob, zipfile
          files = glob.glob("app/build/outputs/apk/github/debug/*.apk")
          assert len(files) == 1, "expected one preview APK"
          with zipfile.ZipFile(files[0]) as apk:
              abis = {p.split("/")[1] for p in apk.namelist() if p.startswith("lib/") and p.endswith(".so")}
          assert {"arm64-v8a", "x86_64"} <= abis, abis
          PY
      - name: Upload unsigned-by-project preview APK for technical testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mate-v0.1.0-technical-preview-debug
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Enable KVM for backup and recovery tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: false
          script: bash scripts/run-connected-verification.sh
      - name: Upload full instrumented results and generated schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Standalone-instrumented-test-results
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
            app/schemas/**
            evidence/long-chat-database-perf.log
          if-no-files-found: warn

      - name: Android Lint (required, independent of preceding test result)
        if: ${{ !cancelled() }}
        run: ./gradlew :app:lintGithubDebug --stacktrace --no-daemon
      - name: Upload full lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Standalone-lint-results
          path: app/build/reports/lint-results*
          if-no-files-found: warn

  android-smoke:
    name: Compare installed Android chat screens
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Emulator checks are mandatory smoke evidence, not physical-device acceptance.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Mate-v0.1.0-technical-preview-debug
          path: candidate
      - name: Fetch verified baseline
        run: |
          curl --fail --location --retry 2 https://github.com/cs9527h/Rikkahub-M/releases/download/v0.2.4/Rikkahub-M-0.2.4.apk -o baseline.apk
          echo 'a634efbdc42dedb37ca5507a65a0cc88b18ab7b33c65ca979a3d63b99f84f13f  baseline.apk' | sha256sum -c -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash scripts/compare-installed-screens.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-screen-comparison
          path: evidence/
          if-no-files-found: error

  perf-benchmark:
    name: Startup performance benchmark (emulator, advisory)
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Do not hide benchmark failures behind an overall green run. Physical acceptance is still required.
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Generate CI-only Firebase placeholder
        run: |
          python3 - <<'PY'
          import json
          config = {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "mate-preview-ci-invalid",
              "storage_bucket": "mate-preview-ci-invalid.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef012345",
                "android_client_info": {
                  "package_name": "com.rikkahub.mate"
                }
              },
              "api_key": [{"current_key": "CI_ONLY_INVALID_API_KEY_DO_NOT_USE"}]
            }],
            "configuration_version": "1"
          }
          with open("app/google-services.json", "w", encoding="utf-8") as f:
            json.dump(config, f)
          PY
      - name: Prepare web-ui build tools
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --dir web-ui install --frozen-lockfile
      - name: Install SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDK_MANAGER" || { echo "Android SDK cmdline tools unavailable"; exit 1; }
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --channel=3 "platform-tools" "platforms;android-37.2" "build-tools;37.0.0" \
            || "$SDK_MANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Restore release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.MATE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MATE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MATE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo "::error::MATE_KEYSTORE_BASE64 missing"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/rikkahubm-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/keys/rikkahubm-release.jks"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } >> local.properties
          chmod 600 local.properties "$RUNNER_TEMP/keys/rikkahubm-release.jks"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          # android-emulator-runner 逐行执行脚本，命令必须写在一行
          script: ./gradlew --no-daemon :app:baselineprofile:connectedBenchmarkReleaseAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=me.rerere.baselineprofile.StartupBenchmarks
      - name: Compare with baseline
        if: always()
        run: python3 scripts/perf_compare.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Startup-performance-evidence
          path: |
            **/build/outputs/**/*.json
            **/build/reports/benchmark/**
          if-no-files-found: warn
