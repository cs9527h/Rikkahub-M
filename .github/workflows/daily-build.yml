name: CI build

# 只做编译与测试的日常检查，不发布任何 nightly / preview 版本。
# 正式安装包只由 release.yml 在通过全部门禁后发布。

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare web-ui build tools
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --dir web-ui install --frozen-lockfile
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --channel=3 "platform-tools" "platforms;android-37.2" "build-tools;37.0.0" \
            || "$SDK_MANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Generate CI-only Firebase placeholder
        run: |
          python3 - <<'PY'
          import json
          clients = []
          for pkg in ("com.rikkahub.mate", "com.rikkahub.mate.debug"):
              clients.append({
                  "client_info": {"mobilesdk_app_id": "1:123456789012:android:0123456789abcdef012345",
                                  "android_client_info": {"package_name": pkg}},
                  "api_key": [{"current_key": "CI_ONLY_INVALID_API_KEY_DO_NOT_USE"}],
              })
          config = {
              "project_info": {"project_number": "123456789012", "project_id": "mate-preview-ci-invalid",
                               "storage_bucket": "mate-preview-ci-invalid.appspot.com"},
              "client": clients,
              "configuration_version": "1",
          }
          with open("app/google-services.json", "w", encoding="utf-8") as f:
              json.dump(config, f)
          PY
      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :ai:testDebugUnitTest :app:testGithubDebugUnitTest --stacktrace --no-daemon
      - name: Assemble debug APK
        run: ./gradlew :app:assembleGithubDebug --stacktrace --no-daemon
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CI-unit-results
          path: |
            app/build/test-results/**
            ai/build/test-results/**
          if-no-files-found: warn
      - name: Android lint
        run: ./gradlew :app:lintGithubDebug --stacktrace --no-daemon
      - name: Enable KVM for memory migration tests
        if: github.event_name == 'pull_request'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        if: github.event_name == 'pull_request'
        with:
          api-level: 35
          arch: x86_64
          script: ./gradlew :app:connectedGithubDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=me.rerere.rikkahub.data.db.migrations.HistoryMemoryMigrationTest,me.rerere.rikkahub.data.ai.HistoryMemoryIntegrationTest --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CI-memory-verification
          path: |
            app/build/reports/lint-results*
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/schemas/**/36.json
          if-no-files-found: warn
