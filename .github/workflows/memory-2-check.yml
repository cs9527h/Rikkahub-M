name: memory-2 compile check
on:
  push:
    branches:
      - 'work/memory-2**'
  workflow_dispatch:
permissions:
  contents: read
env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare web-ui build tools
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --dir web-ui install --frozen-lockfile
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then SDK_MANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"; fi
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --channel=3 "platform-tools" "platforms;android-37.2" "build-tools;37.0.0" \
            || "$SDK_MANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Generate CI-only Firebase placeholder
        run: |
          python3 - <<'PY'
          import json
          clients = [{"client_info": {"mobilesdk_app_id": "1:123456789012:android:0123456789abcdef012345",
                                      "android_client_info": {"package_name": pkg}},
                      "api_key": [{"current_key": "CI_ONLY_INVALID_API_KEY_DO_NOT_USE"}]}
                     for pkg in ("com.rikkahub.mate", "com.rikkahub.mate.debug")]
          config = {"project_info": {"project_number": "123456789012", "project_id": "mate-preview-ci-invalid",
                                     "storage_bucket": "mate-preview-ci-invalid.appspot.com"},
                    "client": clients, "configuration_version": "1"}
          open("app/google-services.json", "w", encoding="utf-8").write(json.dumps(config))
          PY
      - name: Compile and unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :app:compileGithubDebugKotlin :ai:testDebugUnitTest :app:testGithubDebugUnitTest --stacktrace --no-daemon
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-2-check-results
          path: |
            app/build/test-results/**
            ai/build/test-results/**
            app/build/reports/**
          if-no-files-found: warn
