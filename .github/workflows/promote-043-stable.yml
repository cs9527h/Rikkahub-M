name: 将 0.4.3 已验证构建转为正式版

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/promote-043-stable.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 核对现有发行版、已成功的 CI 和 APK 校验和
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=v0.4.3
          EXPECTED_COMMIT=4de5fb35aab1fc2ef61a78b03e949c8a21bcd238
          EXPECTED_SHA256=5036219a08ef3a3974c6639eaa3899b145f2eb349d756b210f84e2f0a9e03d4f
          EXPECTED_CERT=e4b90a5f274074e2d8dbfa4d68226c0941635b6792716b89fd805a2318f2c94a
          test "$(git rev-parse "$TAG^{commit}")" = "$EXPECTED_COMMIT"
          run_status=$(gh api "repos/$GH_REPO/actions/runs/44910381716" --jq '.conclusion')
          run_sha=$(gh api "repos/$GH_REPO/actions/runs/44910381716" --jq '.head_sha')
          test "$run_status" = success
          test "$run_sha" = "$EXPECTED_COMMIT"
          gh api "repos/$GH_REPO/actions/runs/44910381716/jobs?per_page=100" \
            --jq '.jobs[] | select(.name=="Build signed Rikkahub-M APKs" or .name=="Verify signed upgrade from 0.2.4") | .conclusion' \
            | tee /tmp/required-jobs.txt
          test "$(grep -cx success /tmp/required-jobs.txt)" -eq 2
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = false
          mkdir -p /tmp/rikkahub043
          gh release download "$TAG" --dir /tmp/rikkahub043 \
            --pattern 'Rikkahub-M-0.4.3.apk' --pattern SHA256SUMS.txt --pattern APK_SIGNING.txt
          (cd /tmp/rikkahub043 && sha256sum -c SHA256SUMS.txt)
          actual=$(sha256sum /tmp/rikkahub043/Rikkahub-M-0.4.3.apk | cut -d' ' -f1)
          test "$actual" = "$EXPECTED_SHA256"
          grep -iq "$EXPECTED_CERT" /tmp/rikkahub043/APK_SIGNING.txt
          test "$(gh release view "$TAG" --json tagName --jq .tagName)" = "$TAG"
          echo '已核对既有 APK、SHA-256、签名记录、tag、CI 成功状态；不替换二进制。'
      - name: 修改既有 GitHub Release 标记
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit v0.4.3 --repo "$GH_REPO" \
            --title 'Rikkahub-M 0.4.3 正式版' \
            --notes-file docs/releases/0.4.3.md \
            --prerelease=false --latest
          test "$(gh release view v0.4.3 --repo "$GH_REPO" --json isPrerelease --jq .isPrerelease)" = false
          echo '已将 v0.4.3 原资产转为正式版，二进制未改动。'
