name: UI screenshots

# 只做界面截图，不发布任何东西。
# 目的：让 UI 改动有真实渲染证据（浅色/暗色、空态/输入态/发送后），
# 而不是靠色值推算或 Compose Preview 冒充验收。

on:
  # 改到 UI 或截图脚本就自动跑一次，形成视觉回归闭环；
  # 首页/输入框/背景这些改动每一次都能拿到真实截图对比。
  push:
    branches: [work/0.9.0]
    paths:
      - 'app/src/main/java/me/rerere/rikkahub/ui/**'
      - 'scripts/capture-ui-screens.sh'
      - 'scripts/run-ui-capture.sh'
      - '.github/workflows/ui-screenshots.yml'
  workflow_dispatch:
    inputs:
      label:
        description: '输出目录标签（如 baseline-v089 / candidate-v090）'
        type: string
        default: 'candidate'
      apk_url:
        description: '可选：直接安装某个已发布的 APK（留空则构建当前 ref 的 debug 包）'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  capture:
    name: Capture UI screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK_MANAGER" ]; then
            SDK_MANAGER="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --channel=3 "platform-tools" "platforms;android-37.2" "build-tools;37.0.0" \
            || "$SDK_MANAGER" --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Generate CI-only Firebase placeholder
        run: |
          python3 - <<'PY'
          import json
          clients = []
          for pkg in ("com.rikkahub.mate", "com.rikkahub.mate.debug"):
              clients.append({
                  "client_info": {"mobilesdk_app_id": "1:123456789012:android:0123456789abcdef012345",
                                  "android_client_info": {"package_name": pkg}},
                  "api_key": [{"current_key": "CI_ONLY_INVALID_API_KEY_DO_NOT_USE"}],
              })
          config = {
              "project_info": {"project_number": "123456789012", "project_id": "mate-preview-ci-invalid",
                               "storage_bucket": "mate-preview-ci-invalid.appspot.com"},
              "client": clients,
              "configuration_version": "1",
          }
          with open("app/google-services.json", "w", encoding="utf-8") as f:
              json.dump(config, f)
          PY
      - name: Build debug APK
        if: ${{ (inputs.apk_url || '') == '' }}
        run: |
          chmod +x ./gradlew
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm --dir web-ui install --frozen-lockfile
          ./gradlew :app:assembleGithubDebug --stacktrace --no-daemon
          mkdir -p dist
          cp app/build/outputs/apk/github/debug/*.apk dist/candidate.apk
      - name: Download published APK
        if: ${{ (inputs.apk_url || '') != '' }}
        run: |
          mkdir -p dist
          curl --fail --location --retry 3 "${{ inputs.apk_url }}" -o dist/candidate.apk
          ls -lh dist/candidate.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: |
            bash scripts/run-ui-capture.sh "${{ inputs.label || 'auto' }}" dist/candidate.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots-${{ inputs.label || 'auto' }}
          path: evidence/ui-${{ inputs.label || 'auto' }}/**
          if-no-files-found: error
